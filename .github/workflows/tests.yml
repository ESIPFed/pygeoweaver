name: Run Tests

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'
  release:
    types: [published]

jobs:
  test:
    # Python 3.9 is unavailable on the moving ubuntu-latest image (Ubuntu 26.04).
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9' # specify the Python version you need

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Install pytest
        run: |
          pip install pytest

      - name: Run tests
        env:
          # Also verify pinned JDK / H2 digests against the publishers' checksum files.
          PYGEOWEAVER_NETWORK_TESTS: "1"
        run: |
          pytest -s .

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: tests/results/

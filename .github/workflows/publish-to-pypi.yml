name: Publish PyGeoweaver Python 🐍 distributions 📦 to PyPI and TestPyPI

on:
  release:
    types: [published]  # Trigger the workflow when a release is published

jobs:
  test-installation:
    name: Test Python Installation for 3.8, 3.9, 3.10, 3.11
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Package in Editable Mode
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Show Java / package smoke info
        run: |
          java -version
          gw --help >/dev/null
          python -c "import pygeoweaver; from pygeoweaver.version import __version__; print('pygeoweaver', __version__)"
      - name: Test PyGeoweaver start
        run: |
          set -euo pipefail
          gw start || {
            echo "===== ~/geoweaver.log ====="
            cat ~/geoweaver.log 2>/dev/null || echo "(no geoweaver.log)"
            echo "===== java -version ====="
            java -version || true
            exit 1
          }
          echo "PyGeoweaver started successfully"
          gw stop || true

  build-n-publish:
    needs: test-installation
    name: Build and publish Python 🐍 distributions 📦 to PyPI and TestPyPI
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.x"
    - name: Install pypa/build
      run: >-
        python -m
        pip install
        build
        --user
    - name: Build a binary wheel and a source tarball
      run: >-
        python -m
        build
        --sdist
        --wheel
        --outdir dist/
    
    - name: Check GitHub ref
      run: echo ${{ github.ref }}
    
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
